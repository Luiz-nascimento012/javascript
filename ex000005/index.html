<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Botão com Gradiente</title>
<style>
    body {
        background-color: brown;
        color: white;
        font: normal 1.5em Arial;
        text-align: center;
        padding-top: 50px;
    }

    button {
        padding: 15px 30px;
        font-size: 1.2em;
        cursor: pointer;
        border: none;
        border-radius: 8px;
        background-color: #333;
        color: white;
        transition: all 0.3s ease;
    }

    /* Classe que aplica gradiente no texto */
    .gradient-text {
        background: linear-gradient(to right, #ff0000, #ffff00);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }
</style>
</head>
<body>

    <button id="meuBotao">Clique aqui</button>

    <script>
        const botao = document.getElementById("meuBotao");

        botao.addEventListener("click", () => {
            botao.classList.toggle("gradient-text");
        });
    </script>

</body>
</html>
